name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# One run per workflow and ref. On PRs a new push cancels the superseded run.
# On master the running build finishes, and queued intermediates collapse to
# the newest commit, so a burst of merges doesn't queue a full build each.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Rust
      id: toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Cache cargo build
      uses: actions/cache@v6
      if: runner.os != 'macOS'  # cache doesn't seem to behave nicely on macOS, see: https://github.com/ActivityWatch/aw-server-rust/issues/180
      env:
        cache-name: cargo-build-target
      with:
        path: target
        # key needs to contain cachekey due to https://github.com/ActivityWatch/aw-server-rust/issues/180
        key: ${{ runner.os }}-${{ env.cache-name }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ env.cache-name }}-${{ steps.toolchain.outputs.cachekey }}-
    - name: Build
      run: cargo build --workspace --verbose
    # Code-signing services require product name/version metadata on each exe.
    - name: Check Windows version resources
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $metadataJson = cargo metadata --no-deps --format-version 1
        if ($LASTEXITCODE -ne 0) { throw 'cargo metadata failed' }
        $packages = ($metadataJson | ConvertFrom-Json).packages
        function Assert-VersionResources([string]$ProductVersion = '') {
          foreach ($exe in 'aw-server', 'aw-sync') {
            $crateVersion = ($packages | Where-Object name -eq $exe).version
            if (-not $crateVersion) { throw "missing crate version for $exe" }
            $expectedProduct = if ($ProductVersion) { $ProductVersion } else { $crateVersion }
            $info = (Get-Item "target/debug/$exe.exe").VersionInfo
            "${exe}: $($info.ProductName) $($info.ProductVersion) (file $($info.FileVersion))"
            if ($info.ProductName -ne 'ActivityWatch' -or $info.OriginalFilename -ne "$exe.exe" -or
                $info.FileVersion -ne $crateVersion -or $info.ProductVersion -ne $expectedProduct) {
              throw "$exe.exe: expected ActivityWatch, $exe.exe, FileVersion=$crateVersion, ProductVersion=$expectedProduct"
            }
          }
        }
        # Check the initial build's crate-version fallback, then prove changing
        # AW_VERSION alone rebuilds both resources without changing FileVersion.
        Assert-VersionResources
        try {
          $env:AW_VERSION = 'v9.8.7'
          cargo build -p aw-server -p aw-sync --verbose
          if ($LASTEXITCODE -ne 0) { throw 'AW_VERSION override build failed' }
          Assert-VersionResources -ProductVersion '9.8.7'
        } finally {
          Remove-Item Env:AW_VERSION -ErrorAction SilentlyContinue
        }
        # Do not upload binaries carrying the synthetic test product version.
        cargo build -p aw-server -p aw-sync --verbose
        if ($LASTEXITCODE -ne 0) { throw 'crate-version fallback rebuild failed' }
        Assert-VersionResources
    # Known Folder APIs ignore env-var overrides, so the recovery matrix needs a
    # disposable native profile. This proves that seam before any fixture work.
    # It runs before the test suite on purpose: the existing tests already create
    # %LOCALAPPDATA%\activitywatch for the runner user, which would make the
    # "runner profile untouched" half of the proof unprovable.
    - name: Test isolation refusal and readiness guards
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./scripts/test-windows-disposable-profile-guards.ps1
    - name: Prove disposable-profile isolation
      if: runner.os == 'Windows'
      shell: pwsh
      run: >-
        ./scripts/test-windows-disposable-profile.ps1
        -ServerExe target/debug/aw-server.exe
        -EvidencePath "${{ runner.temp }}/windows-disposable-profile-evidence.json"
    - name: Retain Windows isolation evidence
      if: always() && runner.os == 'Windows'
      uses: actions/upload-artifact@v7
      with:
        name: windows-disposable-profile-evidence
        path: ${{ runner.temp }}/windows-disposable-profile-evidence.json
        if-no-files-found: warn
    - name: Run tests
      run: cargo test --workspace --verbose
    - name: Run aw-sync v2 tests (sync-v2 feature)
      run: cargo test -p aw-sync --features sync-v2 v2 --verbose
    - name: Run aw-client CLI tests (cli feature)
      run: cargo test -p aw-client-rust --features cli --verbose
    - uses: actions/upload-artifact@v7
      with:
        # TODO: These binaries are debug builds
        name: binaries-${{runner.os}}
        path: |
          target/*/aw-server
          target/*/aw-server.exe
          target/*/aw-sync
          target/*/aw-sync.exe

  build-android:
    name: Android
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Verify Android build script cwd handling
      run: bash ./scripts/test-compile-android-cwd.sh
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Cache cargo build
      uses: actions/cache@v6
      env:
        cache-name: cargo-build-target-android
      with:
        path: target
        key: ${{ runner.os }}-${{ env.cache-name }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ env.cache-name }}-
    - name: Build
      run: |
        export ANDROID_NDK_HOME=   # needed because GitHub Actions sets it by default...
        make android
    - uses: actions/upload-artifact@v7
      with:
        # TODO: These binaries are debug builds
        name: binaries-android
        path: |
          target/*/*/libaw_server.so

  # Code coverage using tarpaulin
  # Works better than grcov, but not as many fancy features (no branch coverage, no LLVM)
  # See: https://shift.click/blog/github-actions-rust/#code-coverage
  build-coverage-tarpaulin:
    name: Code coverage
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    # Note: If you need to combine the coverage info of multiple
    # feature sets, you need a `.tarpaulin.toml` config file, see
    # the link above for those docs.
    - name: Install cargo-tarpaulin
      run: cargo install cargo-tarpaulin

    - name: Run tests with coverage
      run: cargo tarpaulin --out Xml

    # Note: closed-source code needs to provide a token,
    # but open source code does not.
    - name: Upload to codecov.io
      uses: codecov/codecov-action@v7

